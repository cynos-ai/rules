[project]
name = "cynos-rules-harbor"
version = "0.0.0"
description = "Thin Harbor integration for paired Pi and Pi + Cynos Rules evaluation"
requires-python = ">=3.12"
dependencies = ["harbor==0.22.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cynos_rules_harbor"]
