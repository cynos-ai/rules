name: Rule proposal
description: Propose adding, modifying, or removing one Rule ID.
title: "rule: "
labels: ["rule:proposal", "needs:evidence"]
body:
  - type: dropdown
    id: change
    attributes:
      label: Change type
      options: [Add, Modify, Remove]
    validations:
      required: true
  - type: input
    id: rule-id
    attributes:
      label: Rule ID
      description: Use one stable Rule ID. For additions, propose a CR-AREA-NNN ID.
      placeholder: CR-SCOPE-001
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Observed failure
      description: Describe a real or reproducible failure. Link traces or Evaluation Findings when available.
    validations:
      required: true
  - type: textarea
    id: insufficiency
    attributes:
      label: Why accepted rules and deterministic mechanisms are insufficient
      description: Explain why this is a judgment problem rather than a formatter, linter, schema, hook, host, model, or benchmark defect.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed judgment boundary
      description: State trigger, boundary, observable action or prohibition, stopping condition, and exceptions.
    validations:
      required: true
  - type: textarea
    id: exact-text
    attributes:
      label: Candidate exact English text
      description: Leave explicitly marked as pending only when fixtures must be established first.
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Required scenarios
      description: Include positive, near-neighbor, conflict, and over-following cases.
    validations:
      required: true
  - type: textarea
    id: eval-plan
    attributes:
      label: Pre-registered evaluation plan
      description: Identify fixtures, Dev-30 screening tasks, gates, model identity, Pi version, and budgets before running the candidate.
    validations:
      required: true
  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: This Issue proposes exactly one logical Rule ID, or explains why it cannot be separated.
          required: true
        - label: The proposal contains no benchmark answers, gold patches, hidden tests, or task-specific hints.
          required: true
        - label: The rule is not yet part of the canonical runtime ruleset.
          required: true
