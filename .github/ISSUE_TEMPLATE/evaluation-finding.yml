name: Evaluation finding
description: Record a factual finding from one evaluation campaign.
title: "eval: "
labels: ["eval:finding"]
body:
  - type: input
    id: campaign
    attributes:
      label: Campaign identity
      placeholder: campaign ID and manifest digest
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Frozen configuration
      description: Record model, returned model ID, Pi version, ruleset identity, dataset revision, evaluator, budgets, and relevant digests.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Task-level paired results
      description: Summarize PASS/PASS, FAIL/PASS, PASS/FAIL, FAIL/FAIL, INFRASTRUCTURE, AGENT_FAILURE, and NOT_STARTED_BUDGET outcomes.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts and digests
      description: Link Harbor jobs, official evaluator output, patches, traces, and retained artifact digests. Never paste credentials.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Factual observations
      description: Separate observed behavior from hypotheses about causes or possible rules.
    validations:
      required: true
  - type: checkboxes
    id: holdout
    attributes:
      label: Holdout handling
      options:
        - label: I identified whether this campaign exposed confirmation tasks.
          required: true
        - label: If a confirmation finding is used to optimize the system, the exposed confirmation set will be retired.
          required: true
